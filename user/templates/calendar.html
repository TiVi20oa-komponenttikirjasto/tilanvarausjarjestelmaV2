<!-- Tämä sivu näyttää kalenterin, jossa näkyvät tilojen varaukset ja vapaat ajat. -->
{% extends "master.html" %}

{% block title %}
  Kalenteri
{% endblock %}

{% block content %}
  <h2>Tilojen varaukset ja vapaat ajat</h2>
  <div id="calendar"
    data-authenticated="{{ user.is_authenticated|yesno:'1,0' }}"
    data-first-name="{{ user.first_name|default:''|escape }}"
    data-last-name="{{ user.last_name|default:''|escape }}"
    data-email="{{ user.email|default:''|escape }}"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var calendarEl = document.getElementById("calendar");
      // read authenticated user data from data-attributes
      var dataset = calendarEl ? calendarEl.dataset : {};
      var currentUser = {
        authenticated: dataset.authenticated === '1',
        firstName: dataset.firstName || '',
        lastName: dataset.lastName || '',
        email: dataset.email || ''
      };

      // helper to format YYYY-MM-DD
      function toYMD(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      // get CSRF token from template context
      var csrftoken = '{{ csrf_token }}';

      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        events: "/events-json/1/",
        locale: 'fi',
        selectable: true,
        buttonText: {
          today: 'Tänään'
        },
        selectAllow: function(selectInfo) {
          // prevent selecting past dates
          var start = new Date(selectInfo.start.getFullYear(), selectInfo.start.getMonth(), selectInfo.start.getDate());
          var end = new Date(selectInfo.end.getFullYear(), selectInfo.end.getMonth(), selectInfo.end.getDate());
          var today = new Date();
          var todayKey = toYMD(new Date(today.getFullYear(), today.getMonth(), today.getDate()));
          var cur = new Date(start);
          while (cur < end) {
            var key = toYMD(cur);
            if (key < todayKey) return false;
            cur.setDate(cur.getDate() + 1);
          }
          return true;
        },
        select: function(info) {
          // If user is authenticated, auto-submit bookings for selected days
          if (!currentUser.authenticated) {
            // not authenticated — fallback: do nothing here (or show message)
            alert('Kirjaudu sisään tehdäksesi varauksen.');
            calendar.unselect();
            return;
          }
          var startDate = new Date(info.start.getFullYear(), info.start.getMonth(), info.start.getDate());
          var endDate = new Date(info.end.getFullYear(), info.end.getMonth(), info.end.getDate());
          var dayStrs = [];
          var cur = new Date(startDate);
          while (cur < endDate) {
            dayStrs.push(toYMD(cur));
            cur.setDate(cur.getDate() + 1);
          }
          if (dayStrs.length === 0) { calendar.unselect(); return; }

          // send bookings sequentially
          (async function(){
            for (var i = 0; i < dayStrs.length; i++) {
              var day = dayStrs[i];
              try {
                var resp = await fetch('/add-event/', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
                  body: JSON.stringify({ title: 'varattu', start: day + 'T00:00:00', end: day + 'T23:59:59', space_id: 1, first_name: currentUser.firstName, last_name: currentUser.lastName, email: currentUser.email })
                });
                var j = await resp.json();
                if (j.status !== 'ok') {
                  alert('Varauksen luominen epäonnistui: ' + (j.message || JSON.stringify(j)));
                  calendar.refetchEvents();
                  return;
                }
              } catch (err) {
                alert('Verkkovirhe yritettäessä varata: ' + err);
                calendar.refetchEvents();
                return;
              }
            }
            alert('Varaukset luotu: ' + dayStrs.length + ' päivän ajan.');
            calendar.refetchEvents();
            calendar.unselect();
          })();
        }
      });
      calendar.render();
    });
  </script>
{% endblock %}
