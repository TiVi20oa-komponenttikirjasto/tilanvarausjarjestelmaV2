<!-- Tämä on sovelluksen päätemplatetiedosto, johon muut sivut periytyvät. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}{% endblock %}</title>
  {% load bootstrap5 %}
  {% bootstrap_css %}
  {% bootstrap_javascript %}
  {% load static %}
  <link rel="stylesheet" href="{% static 'mystatic.css' %}">
  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>
  <nav class="topnav d-flex align-items-center justify-content-between p-2">
    <div>
      <a href="{% url 'main' %}" class="btn btn-primary">Etusivu</a>
      <a href="{% url 'space' %}" class="btn btn-primary">Tilat</a>
    </div>

    <div>
      {% if request.user.is_authenticated %}
        <span class="me-2">
          Kirjautunut: <strong>{{ request.user.username }}</strong>
          <!-- Jos haluat että sähköposti näkyy, ota alempi rivi pois kommenteista -->
          <!-- {% if request.user.email %} ({{ request.user.email }}){% endif %} -->
        </span>
        <a href="{% url 'profile' %}" class="btn btn-primary">Profiili</a>
        <a href="{% url 'logout' %}" class="btn btn-primary">Kirjaudu ulos</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-primary">Kirjaudu</a>
        <a href="{% url 'register' %}" class="btn btn-success ms-2">Rekisteröidy</a>
      {% endif %}
    </div>
  </nav>

  {% block content %}
  {% endblock %}
</body>
</html>
