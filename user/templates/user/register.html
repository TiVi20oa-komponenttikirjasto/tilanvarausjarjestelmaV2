{% extends "master.html" %}

{% block title %}
  Tilanvarausjarjestelma
{% endblock %}

{% block content %}
  <head>
    <title>Rekisteröinti</title>
  </head>
  <body>
    <h1>Rekisteröidy</h1>
      <form method="post" action="{% url 'register' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Luo tili</button>
      </form>
    <br>
    <p>Onko sinulla jo tili? 
      <a href="{% url 'login' %}"><br>
        <button class="btn btn-primary">Kirjaudu</button>
      </a>
    </p>
  </body>
{% endblock %}
