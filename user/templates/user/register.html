<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <title>Rekisteröinti</title>
</head>
<body>
  <h1>Rekisteröidy</h1>

  <form method="post" action="{% url 'register' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Luo tili</button>
  </form>

  <p>Onko sinulla jo tili? <a href="{% url 'login' %}">Kirjaudu</a></p>
</body>
</html>
