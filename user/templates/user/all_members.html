{% extends "master.html" %}

{% block title %}
  Käyttäjät - Lista kaikista Käyttäjistä
{% endblock %}

{% block content %}

  <!-- Kortti alkaa tästä -->
  <div class="mycard">

    <!-- Kortin header -->
    <div class="mycard-header">
      <h1>Käyttäjät</h1>
    </div>

    <!-- Kortin sisältö -->
    <div class="mycard-body">
      <p>Lista kaikista käyttäjistä järjestelmässä.</p>

      <ul>
        {% for member in mymembers %}
          <li>{{ member.username }} ({{ member.email }})</li>
        {% endfor %}
      </ul>
    </div>

    <!-- Kortti loppuu tähän -->
  </div>
{% endblock %}
