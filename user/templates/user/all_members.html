<!-- Tämä sivu näyttää kaikki järjestelmän käyttäjät listana. -->

{% extends "master.html" %}

{% block title %}
  Käyttäjät - Lista kaikista Käyttäjistä
{% endblock %}

{% block content %}

  <!-- Kortti alkaa tästä -->
  <div class="mycard">

    <!-- Kortin header -->
    <div class="mycard-header">
      <h1>Käyttäjät</h1>
    </div>

    <!-- Kortin sisältö -->
    <div class="mycard-body">
      <p>Lista kaikista käyttäjistä järjestelmässä.</p>

      <!-- For loop jossa kaikki käyttäjät käydään läpi -->
      <ul>
        {% for x in mymembers %}
          <li>
            <a href="users_details/{{ x.id }}">{{ x.firstname }} {{ x.lastname }}</a>
          </li>

        <!-- Lopetetaan For loop -->
        {% endfor %}
      </ul>
    </div>

    <!-- Kortti loppuu tähän -->
  </div>
{% endblock %}
