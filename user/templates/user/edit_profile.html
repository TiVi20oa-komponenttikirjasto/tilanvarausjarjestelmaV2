{% extends "master.html" %}

{% block content %}
<div>
    <h2>Oma profiili</h2>

    {% if message %}
    <div class="mt-2">
        {% for message in message %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="row">
        <div class="col-md-6">
            <h4>Muokkaa tietojasi</h4>
            <form method="post">
                {% csrf_token %}
                {{ profile_form.as_p }}
                <button type="submit" name="edit_profile" class="btn btn-primary mt-2">Tallenna muutokset</button>
            </form>
        </div>

        <div class="col-md-6">
            <h4>Vaihda salasana</h4>
            <form method="post">
                {% csrf_token %}
                {{ password_form.as_p }}
                <button type="submit" name="change_password" class="btn btn-primary mt-2">Vaihda salasana</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
